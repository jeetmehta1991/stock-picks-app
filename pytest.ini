[pytest]
testpaths = backtest/tests
markers =
    slow: tests that take >30s (cache load, 4-fold WF, e2e smoke)
    performance: load/throughput/concurrency tests (G3)
    integration: cross-module integration tests
    smoke: end-to-end pipeline smoke tests (G1)
    bad_data: engine resilience under malformed inputs (G2)
    acceptance: functional/acceptance tests asserting end-to-end requirements (G5)
filterwarnings =
    ignore::DeprecationWarning
