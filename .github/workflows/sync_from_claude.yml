name: Sync from Claude

on:
  workflow_dispatch:
    inputs:
      description:
        description: "What changed in this sync"
        required: true
        type: string

jobs:
  sync:
    name: Sync files from claude-updates branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and merge claude-updates
        run: |
          git fetch origin claude-updates
          git merge origin/claude-updates --strategy-option=theirs -m "Claude sync $(date +%Y-%m-%d) — ${{ github.event.inputs.description }}"
          git push origin main
          echo "Synced claude-updates to main"

      - name: Validate imports
        run: |
          pip install yfinance pandas-ta pyarrow requests --quiet
          python -c "
          import sys; sys.path.insert(0, '.')
          from backtest.config import UNIVERSE, PASSING_CRITERIA
          from backtest.signals.screener import ALL_STRATEGIES
          from backtest.engine.exit_strategies import EXIT_STRATEGIES
          print(f'OK: {len(UNIVERSE)} instruments, {len(ALL_STRATEGIES)} strategies, {len(EXIT_STRATEGIES)} exits')
          "

      - name: Summary
        run: |
          echo "### Sync complete" >> $GITHUB_STEP_SUMMARY
          echo "**Description:** ${{ github.event.inputs.description }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +%Y-%m-%d' '%H:%M' UTC')" >> $GITHUB_STEP_SUMMARY
