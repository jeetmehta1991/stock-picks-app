name: Deploy Sprint 0A Dashboard to GitHub Pages

# Pass 53 Day-9 v8h+1 owner-mandated 2026-05-08:
# Custom Pages workflow that uploads ONLY the dashboard, not the
# 2.6 GB data_prefetch/ tree which would exceed Pages artifact limits.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard_sprint0a/**'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but DON'T cancel in-progress
# (per owner directive 2026-05-08 - rapid pushes shouldn't kill builds).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dashboard-only site (excludes data_prefetch/, backtest/, etc.)
        run: |
          set -e
          mkdir -p _site/dashboard_sprint0a
          cp -r dashboard_sprint0a/* _site/dashboard_sprint0a/
          cp index.html _site/index.html
          touch _site/.nojekyll
          echo "Site contents:"
          ls -la _site
          echo "Site size:"
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
