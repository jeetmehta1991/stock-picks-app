name: Deploy Dashboards to GitHub Pages
# Updated 2026-05-08: now includes dashboard_stage_2 alongside dashboard_sprint0a
# Updated 2026-05-15: added dashboard_phase_1a (Phase 1A Trade Summary).
# Force rebuild 2026-05-08 evening (ensure data.js included in deploy artifact)

# Pass 53 Day-9 v8h+1 owner-mandated 2026-05-08:
# Custom Pages workflow that uploads ONLY the dashboards, not the
# 2.6 GB data_prefetch/ tree which would exceed Pages artifact limits.

on:
  push:
    branches: [main]
    paths:
      - 'dashboard_sprint0a/**'
      - 'dashboard_stage_2/**'
      - 'dashboard_r5_cube/**'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, but DON'T cancel in-progress
# (per owner directive 2026-05-08 - rapid pushes shouldn't kill builds).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dashboards-only site (excludes data_prefetch/, backtest/, etc.)
        run: |
          set -e
          # 2026-07-24 (B1362): phase-1a lineage dashboards (phase_1a, phase_1a_beta,
          # phase_1b, r5) ARCHIVED to archive/dashboards_pre_r5_2026-07-24/ per owner
          # directive - superseded by dashboard_r5_cube (the latest R5 cube dashboard).
          # Retained: sprint0a (API coverage), stage_2 (decisions/bugs registry), r5_cube.
          mkdir -p _site/dashboard_sprint0a _site/dashboard_stage_2 _site/dashboard_r5_cube
          cp -r dashboard_sprint0a/* _site/dashboard_sprint0a/
          cp -r dashboard_stage_2/* _site/dashboard_stage_2/
          # R5 cube dashboard on the 22-tab template -
          # index.html reads data.js (window.PHASE_1A_DATA); data.json for consumers.
          cp dashboard_r5_cube/index.html dashboard_r5_cube/app.js dashboard_r5_cube/data.js dashboard_r5_cube/data.json dashboard_r5_cube/last_run.txt _site/dashboard_r5_cube/
          cp index.html _site/index.html
          touch _site/.nojekyll
          echo "=== Site root contents ==="
          ls -la _site
          echo "=== dashboard_sprint0a contents ==="
          ls -la _site/dashboard_sprint0a
          echo "=== dashboard_stage_2 contents ==="
          ls -la _site/dashboard_stage_2
          echo "=== dashboard_r5_cube contents ==="
          ls -la _site/dashboard_r5_cube
          echo "=== Site size ==="
          du -sh _site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
