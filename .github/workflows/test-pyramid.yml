name: Test Pyramid

on:
  push:
    branches:
      - main
      # Batch 488 (2026-05-30): trigger CI on `batch/**` feature branches per
      # CHECKLIST #103 feature-branch workflow. PAT lacks pull_requests:write
      # scope so PRs can't be opened from the SDK environment; firing on
      # push covers the same goal -- CI validates the branch before merge.
      - 'batch/**'
    paths:
      - 'backtest/**'
      - 'scripts/**'
      - 'pytest.ini'
      - '.github/workflows/test-pyramid.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Batch 490 (2026-05-30): the previous workflow ran 12 tiers + a Tier-12
  # catch-all SEQUENTIALLY in a single job, so wall-clock time was the SUM of
  # all tier durations (~25-45 min). This rewrite runs each tier as a
  # parallel matrix job, so wall-clock = MAX(tier) which is the Tier-12
  # catch-all (~10-15 min). Net CI speedup ~2-3x. Each job gets its own
  # cached pip install, so the install cost (~3-4 min cold) repeats per
  # matrix entry, but happens in parallel rather than serial -- still a net
  # win because the prior sequential job did the install once but then ran
  # 13 tiers serially in the same job.

  pyramid:
    name: ${{ matrix.tier.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.tier.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        tier:
          - { name: "Tier 1 Unit",                paths: "backtest/tests/test_unit.py",                                               timeout: 20 }
          - { name: "Tier 2 Integration",         paths: "backtest/tests/test_integration.py",                                        timeout: 30 }
          - { name: "Tier 3 Data integrity",      paths: "backtest/tests/test_data_integrity.py",                                     timeout: 20 }
          - { name: "Tier 4 Bad-data stress",     paths: "backtest/tests/test_engine_bad_data_stress.py",                             timeout: 20 }
          - { name: "Tier 5 Acceptance",          paths: "backtest/tests/test_acceptance_functional.py",                              timeout: 20 }
          - { name: "Tier 5b Phase gates",        paths: "backtest/tests/test_gates.py",                                              timeout: 20 }
          - { name: "Tier 6 Partial-spec",        paths: "backtest/tests/test_partial_spec_artifacts.py backtest/tests/test_partial_spec_artifacts_v2.py", timeout: 20 }
          - { name: "Tier 7 N1/N2/N5/N6 wiring",  paths: "backtest/tests/test_n1_n2_artifacts.py backtest/tests/test_n5_n6_wiring.py", timeout: 20 }
          - { name: "Tier 8 Walk-forward",        paths: "backtest/tests/test_walk_forward_4fold.py",                                 timeout: 30 }
          - { name: "Tier 9 Exit context",        paths: "backtest/tests/test_exit_context.py backtest/tests/test_exit_conditional_analyzer.py", timeout: 20 }
          - { name: "Tier 10 Cache schema",       paths: "backtest/tests/test_cache_schema_b.py",                                     timeout: 20 }
          - { name: "Tier 11 Silent-gap",         paths: "backtest/tests/test_silent_gap_pyramid.py",                                 timeout: 20 }
          - { name: "Tier 12 Catch-all (xdist)",  paths: "backtest/tests/",                                                            timeout: 45, xdist: true }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Batch 520 (2026-05-31) DET1 production fix: pin pandas/numpy to
          # the EXACT Windows-local versions used to generate the committed
          # Windows baseline (platform_determinism_windows.json). Prior CI
          # used latest pip-resolved (pandas 3.0.3 + numpy 2.4.6) and rsi_14
          # diverged sub-epsilon vs the Windows baseline (Batch 518 trace).
          # Same versions across all platforms => same fingerprints => no
          # DET1 drift. Re-evaluate when upgrading either library.
          pip install "pandas==3.0.2" "numpy==2.4.4" filelock pyarrow psutil python-dateutil pytz pytest
          pip install yfinance requests --quiet
          pip install pandas-ta --quiet || pip install ta --quiet || true
          pip install freezegun --quiet || true
          pip install hypothesis --quiet || true
          pip install "statsmodels>=0.14.0" --quiet
          pip install scipy --quiet
          pip install pandas-market-calendars --quiet || true
          pip install xgboost --quiet
          pip install scikit-learn --quiet
          pip install "numba>=0.58.1" --quiet
          export SMC_CREDIT=0
          pip install -e vendored/smartmoneyconcepts/ --quiet
          # xdist needed for Tier 12 catch-all; harmless on other tiers
          pip install pytest-xdist --quiet

      - name: Run ${{ matrix.tier.name }}
        run: |
          if [ "${{ matrix.tier.xdist }}" = "true" ]; then
            python -m pytest ${{ matrix.tier.paths }} -n auto -q --tb=short
          else
            python -m pytest ${{ matrix.tier.paths }} -q --tb=short
          fi

  informational:
    name: Informational tiers (G1 + G3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Informational only -- can fail without blocking; runs in parallel
    # alongside the mandatory pyramid matrix.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Batch 520 (2026-05-31) DET1 production fix: same pin rationale
          # as the pyramid matrix above. Informational jobs use the same
          # pandas/numpy versions to keep G1/G3 in fingerprint parity.
          pip install "pandas==3.0.2" "numpy==2.4.4" filelock pyarrow psutil python-dateutil pytz pytest
          pip install yfinance requests --quiet
          pip install pandas-ta --quiet || pip install ta --quiet || true
          pip install freezegun --quiet || true
          pip install hypothesis --quiet || true
          pip install "statsmodels>=0.14.0" --quiet
          pip install scipy --quiet
          pip install pandas-market-calendars --quiet || true
          export SMC_CREDIT=0
          pip install -e vendored/smartmoneyconcepts/ --quiet

      - name: Performance / load (G3)
        run: |
          python -m pytest backtest/tests/test_performance_load.py -q --tb=short || echo "skipped (likely no cache in CI)"
        continue-on-error: true

      - name: E2E smoke (G1)
        run: |
          python -m pytest backtest/tests/test_e2e_phase1a_smoke.py -q --tb=short || echo "skipped (likely no cache in CI)"
        continue-on-error: true

  summary:
    name: Pyramid summary
    needs: [pyramid]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate
        run: |
          echo "### Test Pyramid Result" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +%Y-%m-%d' '%H:%M' UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Layout (Batch 490):** 13 mandatory tiers run as PARALLEL matrix jobs (wall time = max-of-tiers, not sum). Informational G1 + G3 run as a separate parallel job." >> $GITHUB_STEP_SUMMARY
          echo "**Mandatory tiers (13):** Unit + Integration + Data integrity + Bad-data (G2) + Acceptance (G5) + Phase Gates + Partial-spec + Wiring + Walk-forward + Exit context + Cache schema + Silent-gap + Catch-all (xdist)" >> $GITHUB_STEP_SUMMARY
          echo "**Informational (2):** Performance/load (G3) + E2E smoke (G1)" >> $GITHUB_STEP_SUMMARY
          echo "**G4:** This workflow itself -- automated pyramid execution on every push to main + batch/** branches" >> $GITHUB_STEP_SUMMARY
