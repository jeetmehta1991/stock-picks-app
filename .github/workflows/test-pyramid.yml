name: Test Pyramid

on:
  push:
    branches: [main]
    paths:
      - 'backtest/**'
      - 'scripts/**'
      - 'pytest.ini'
      - '.github/workflows/test-pyramid.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pyramid:
    name: Run Pass 53 test pyramid (DEC-503)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy filelock pyarrow psutil python-dateutil pytz
          pip install yfinance requests --quiet
          pip install pandas-ta --quiet || pip install ta --quiet || true
          # Optional libs that some tests skip on if missing
          pip install freezegun --quiet || true
          # DEC-414/416 statistical methodology (Pass 53 Batch 41) + DEC-210
          # PSR / scipy.stats - required by Batch 49-68 helpers in metrics.py.
          # Previously omitted in CI -> caused test_dec_414/test_dec_416 +
          # any helper using statsmodels/scipy to fail with ImportError.
          pip install "statsmodels>=0.14.0" --quiet
          pip install scipy --quiet
          # DEC-235 NYSE calendar (optional; falls back to Mon-Fri if missing)
          pip install pandas-market-calendars --quiet || true
          # Batch 249 CI fix (Pass 53 Day 9+ 2026-05-20): root cause of 30+
          # consecutive Test Pyramid #313-#343 failures. Two tests in
          # test_unit.py require dependencies not previously installed in CI:
          #   - test_batch228_xgboost_meta_labeler_preferred: xgboost + sklearn
          #     (Joubert-Snyman 2024 meta-labeler per DEC-045 fork-first)
          #   - test_batch216_compute_smc_signals_emits_new_keys: numba
          #     (smartmoneyconcepts library dep per vendored/smartmoneyconcepts
          #      setup.py install_requires; library import silently fails
          #      without numba -> compute_smc_signals returns {})
          pip install xgboost --quiet
          pip install scikit-learn --quiet
          pip install "numba>=0.58.1" --quiet

      - name: Tier 1 — Unit tests
        run: |
          python -m pytest backtest/tests/test_unit.py -q --tb=short
        continue-on-error: false

      - name: Tier 2 — Integration tests
        run: |
          python -m pytest backtest/tests/test_integration.py -q --tb=short
        continue-on-error: false

      - name: Tier 3 — Data integrity tests (DEC-591)
        run: |
          python -m pytest backtest/tests/test_data_integrity.py -q --tb=short
        continue-on-error: false

      - name: Tier 4 — Bad-data stress (G2 / DEC-503)
        run: |
          python -m pytest backtest/tests/test_engine_bad_data_stress.py -q --tb=short
        continue-on-error: false

      - name: Tier 5 — Acceptance / functional (G5 / DEC-503)
        run: |
          python -m pytest backtest/tests/test_acceptance_functional.py -q --tb=short
        continue-on-error: false

      - name: Tier 5b — Phase gates (DEC-595)
        run: |
          python -m pytest backtest/tests/test_gates.py -q --tb=short
        continue-on-error: false

      - name: Tier 6 — Day-9 partial-spec artifacts
        run: |
          python -m pytest backtest/tests/test_partial_spec_artifacts.py backtest/tests/test_partial_spec_artifacts_v2.py -q --tb=short
        continue-on-error: false

      - name: Tier 7 — N1/N2/N5/N6 wiring
        run: |
          python -m pytest backtest/tests/test_n1_n2_artifacts.py backtest/tests/test_n5_n6_wiring.py -q --tb=short
        continue-on-error: false

      - name: Tier 8 — Walk-forward 4-fold (DEC-505)
        run: |
          python -m pytest backtest/tests/test_walk_forward_4fold.py -q --tb=short
        continue-on-error: false

      - name: Tier 9 — Exit context + conditional analyzer
        run: |
          python -m pytest backtest/tests/test_exit_context.py backtest/tests/test_exit_conditional_analyzer.py -q --tb=short
        continue-on-error: false

      - name: Tier 10 — Cache schema regression (Pass 53 H6)
        run: |
          python -m pytest backtest/tests/test_cache_schema_b.py -q --tb=short
        continue-on-error: false

      - name: Performance / load (G3) — informational; cache may be empty in CI
        run: |
          python -m pytest backtest/tests/test_performance_load.py -q --tb=short || echo "skipped (likely no cache in CI)"
        continue-on-error: true

      - name: E2E smoke (G1) — informational; cache may be empty in CI
        run: |
          python -m pytest backtest/tests/test_e2e_phase1a_smoke.py -q --tb=short || echo "skipped (likely no cache in CI)"
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          echo "### Test Pyramid Result" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date +%Y-%m-%d' '%H:%M' UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Mandatory tiers (11):** Unit + Integration + Data integrity + Bad-data (G2) + Acceptance (G5) + Phase Gates + Partial-spec + Wiring + Walk-forward + Exit context + Cache schema" >> $GITHUB_STEP_SUMMARY
          echo "**Informational tiers (2):** Performance/load (G3) + E2E smoke (G1) — skip on cache-empty CI" >> $GITHUB_STEP_SUMMARY
          echo "**G4:** This workflow itself — automated pyramid execution on every push to main" >> $GITHUB_STEP_SUMMARY
